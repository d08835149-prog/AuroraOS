<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toronto Airport OS</title>

    <style>
        body{
            margin:0;
            font-family:Arial, Helvetica, sans-serif;
            background:linear-gradient(#0f172a,#1e293b);
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .window{
            width:800px;
            padding:40px;
            border-radius:20px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(15px);
            text-align:center;
            box-shadow:0 20px 40px rgba(0,0,0,.4);
        }

        h1{
            margin-bottom:10px;
            font-size:48px;
        }

        p{
            color:#cbd5e1;
        }

        button{
            margin-top:30px;
            padding:15px 35px;
            border:none;
            border-radius:10px;
            background:#3b82f6;
            color:white;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#2563eb;
        }
    </style>
</head>
<body>

<div class="window">
    <h1>✈ Toronto Airport OS</h1>
    <p>Welcome, Suhyun.</p>
    <p>Interactive Airport Management System</p>

    <button>Enter Airport</button>
</div>

</body>
</html>
