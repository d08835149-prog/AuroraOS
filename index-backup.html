<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AuroraOS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background:
        radial-gradient(circle at 20% 30%, rgba(61, 255, 206, 0.28), transparent 32%),
        radial-gradient(circle at 80% 25%, rgba(168, 85, 247, 0.35), transparent 35%),
        radial-gradient(circle at 50% 85%, rgba(59, 130, 246, 0.25), transparent 35%),
        linear-gradient(135deg, #07111f, #111827 45%, #1e1b4b);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .aurora {
      position: absolute;
      width: 700px;
      height: 300px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      animation: moveAurora 8s ease-in-out infinite alternate;
    }

    .aurora-one {
      top: -80px;
      left: -100px;
      background: linear-gradient(
        90deg,
        rgba(45, 212, 191, 0.75),
        rgba(59, 130, 246, 0.45)
      );
    }

    .aurora-two {
      right: -150px;
      bottom: -80px;
      background: linear-gradient(
        90deg,
        rgba(139, 92, 246, 0.7),
        rgba(236, 72, 153, 0.35)
      );
      animation-delay: 1.5s;
    }

    @keyframes moveAurora {
      from {
        transform: translateX(-30px) translateY(-10px) rotate(-4deg);
      }

      to {
        transform: translateX(50px) translateY(30px) rotate(8deg);
      }
    }

    .stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: white;
      opacity: 0.7;
      animation: twinkle 2.5s ease-in-out infinite alternate;
    }

    .star:nth-child(1) {
      top: 12%;
      left: 18%;
    }

    .star:nth-child(2) {
      top: 24%;
      left: 72%;
      animation-delay: 0.7s;
    }

    .star:nth-child(3) {
      top: 68%;
      left: 15%;
      animation-delay: 1.2s;
    }

    .star:nth-child(4) {
      top: 78%;
      left: 82%;
      animation-delay: 0.3s;
    }

    .star:nth-child(5) {
      top: 42%;
      left: 90%;
      animation-delay: 1.6s;
    }

    .star:nth-child(6) {
      top: 15%;
      left: 48%;
      animation-delay: 0.9s;
    }

    @keyframes twinkle {
      from {
        opacity: 0.25;
        transform: scale(0.8);
      }

      to {
        opacity: 1;
        transform: scale(1.8);
      }
    }

    .welcome-card {
      position: relative;
      z-index: 2;
      width: min(90%, 720px);
      padding: 60px 40px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(22px);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .logo {
      width: 82px;
      height: 82px;
      margin: 0 auto 24px;
      border-radius: 24px;
      background: linear-gradient(
        135deg,
        #2dd4bf,
        #3b82f6,
        #8b5cf6
      );
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 38px;
      box-shadow: 0 15px 40px rgba(59, 130, 246, 0.35);
    }

    h1 {
      margin: 0;
      font-size: clamp(48px, 8vw, 76px);
      letter-spacing: -3px;
    }

    .subtitle {
      margin-top: 14px;
      font-size: 22px;
      color: #e2e8f0;
    }

    .description {
      margin: 12px 0 0;
      font-size: 16px;
      color: #aebbd0;
    }

    .enter-button {
      margin-top: 38px;
      padding: 15px 34px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 999px;
      color: white;
      background: rgba(255, 255, 255, 0.12);
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition:
        transform 0.25s ease,
        background 0.25s ease,
        box-shadow 0.25s ease;
    }

    .enter-button:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 12px 30px rgba(76, 139, 245, 0.25);
    }

    .enter-button:active {
      transform: translateY(0);
    }

    .status {
      margin-top: 28px;
      font-size: 13px;
      color: #94a3b8;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 7px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 12px #34d399;
    }

    @media (max-width: 600px) {
      .welcome-card {
        padding: 45px 22px;
      }

      h1 {
        letter-spacing: -2px;
      }

      .subtitle {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>
  <div class="aurora aurora-one"></div>
  <div class="aurora aurora-two"></div>

  <div class="stars">
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
  </div>

  <main class="welcome-card">
    <div class="logo">✦</div>

    <h1>AuroraOS</h1>

    <p class="subtitle">Welcome back, Ditto.</p>

    <p class="description">
      Your personal digital workspace is ready.
    </p>

    <button class="enter-button" onclick="enterDesktop()">
      Enter Desktop
    </button>

    <p class="status">
      <span class="status-dot"></span>
      System ready
    </p>
  </main>

  <script>
    function enterDesktop() {
      window.location.href = "desktop.html";
    }
  </script>
</body>
</html>
